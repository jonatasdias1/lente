<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Controle da Lente</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lente">
<meta name="theme-color" content="#e9ebf2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0c12" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style id="css">
/* Layout: painel com barra lateral, cartões de números, anel de progresso, gráfico mensal e cronograma */
:root{
  --bg:#e9ebf2; --panel:#f5f6fa; --card:#ffffff; --fg:#161827; --muted:#7a7f95; --line:#e7e9f0; --track:#dfe1ea;
  --accent:#4352ec; --accent-fg:#ffffff; --accent-soft:#eceefe;
  --ok:#1a9a52; --ok-soft:#ddf6e6; --warn:#e5484d; --warn-soft:#fde8e8; --part:#c97a09; --part-soft:#fdf1dc;
  --ink:#16171f; --ink-fg:#ffffff;
  --font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b0c12; --panel:#12141d; --card:#1a1d2a; --fg:#eceef6; --muted:#9097ae; --line:#272a3a; --track:#2c3043;
  --accent:#6d79ff; --accent-fg:#ffffff; --accent-soft:#252a52;
  --ok:#43d17f; --ok-soft:#163323; --warn:#ff6b6f; --warn-soft:#3b1a1d; --part:#f0a63a; --part-soft:#3a2b12;
  --ink:#262a3c; --ink-fg:#ffffff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b0c12; --panel:#12141d; --card:#1a1d2a; --fg:#eceef6; --muted:#9097ae; --line:#272a3a; --track:#2c3043;
  --accent:#6d79ff; --accent-fg:#ffffff; --accent-soft:#252a52;
  --ok:#43d17f; --ok-soft:#163323; --warn:#ff6b6f; --warn-soft:#3b1a1d; --part:#f0a63a; --part-soft:#3a2b12;
  --ink:#262a3c; --ink-fg:#ffffff; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
.sm,.mbrand{display:none}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.45}
.outer{padding-top:max(24px,env(safe-area-inset-top,0px));padding-bottom:max(24px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.shell{max-width:1180px;margin:0 auto;background:var(--panel);border-radius:28px;padding:16px;display:grid;grid-template-columns:210px minmax(0,1fr);gap:20px}
/* sidebar */
aside{background:var(--card);border-radius:22px;padding:20px 14px;display:flex;flex-direction:column;gap:22px;position:sticky;top:calc(16px + env(safe-area-inset-top,0px));align-self:start;height:calc(100vh - 56px);overflow-y:auto;z-index:5;box-shadow:0 10px 30px -22px rgba(20,24,60,.35)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;padding:0 6px;line-height:1.25}
.brand small{display:block;font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.logo{flex:none}
.logo{width:30px;height:30px;border-radius:9px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center}
.menu{display:grid;gap:4px}
.menu .cap{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:0 8px 4px}
.menu a,.menu button{font:500 14px var(--font);background:none;border:0;cursor:pointer;text-align:left;width:100%;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;color:var(--fg);text-decoration:none;font-weight:500}
.menu button:hover,.menu a:hover{background:var(--accent-soft)}
.menu a.on{background:var(--accent);color:var(--accent-fg);box-shadow:0 8px 18px -8px var(--accent)}
.promo{margin-top:auto;background:var(--ink);color:var(--ink-fg);border-radius:18px;padding:16px;display:grid;gap:8px}
.promo .small{font-size:12px;opacity:.72}
.promo .val{font-size:18px;font-weight:800}
/* main */
main{display:grid;gap:16px;min-width:0;padding:6px 4px 4px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-size:24px;font-weight:800;margin:0;letter-spacing:-.02em}
.date{color:var(--muted);font-size:13px;margin-top:2px}
.tools{display:flex;align-items:center;gap:10px}
.iconbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--fg);display:grid;place-items:center;cursor:pointer}
.save{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 12px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.save.ok .dot{background:var(--ok)} .save.busy .dot{background:var(--accent)} .save.err .dot{background:var(--warn)}
.who{display:flex;align-items:center;gap:8px;font-weight:600}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:800}
.grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card{background:var(--card);border-radius:22px;padding:18px;min-width:0}
.stat{display:flex;flex-direction:column;gap:6px}
.stat .row1{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
.ico{width:40px;height:40px;border-radius:12px;background:var(--panel);display:grid;place-items:center;color:var(--fg)}
.stat.hero{background:var(--accent);color:var(--accent-fg);box-shadow:0 18px 30px -18px var(--accent)}
.stat.hero .ico{background:#ffffff;color:var(--accent)}
.stat.hero .muted{color:rgba(255,255,255,.78)}
.badge{font-size:11.5px;font-weight:700;border-radius:999px;padding:3px 9px;white-space:nowrap}
.badge.g{background:var(--ok-soft);color:var(--ok)} .badge.r{background:var(--warn-soft);color:var(--warn)}
.badge.w{background:rgba(255,255,255,.22);color:#fff} .badge.a{background:var(--accent-soft);color:var(--accent)}
.lbl{font-weight:600;font-size:13px}
.num{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.big{font-size:26px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.muted{color:var(--muted);font-size:12px}
.money{display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:12px;padding:3px 10px;background:var(--panel)}
.money:focus-within{border-color:var(--accent)}
.money span{color:var(--muted);font-weight:600;font-size:13px}
.money input{border:0;background:transparent;color:var(--fg);font:800 22px var(--font);width:100%;min-width:0;outline:none;font-variant-numeric:tabular-nums}
h2{font-size:17px;font-weight:700;margin:0}
.chead{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.chip{font-size:12px;font-weight:600;border:1px solid var(--line);border-radius:10px;padding:6px 10px;color:var(--muted)}
/* rings */
.ringwrap{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.ringwrap svg{width:170px;height:170px;max-width:100%}
.ringtxt .big{font-size:30px}
.legend{display:grid;gap:12px;margin-top:16px}
.legend div{display:grid;grid-template-columns:12px 1fr auto auto;gap:10px;align-items:center;font-weight:600}
.legend i{width:10px;height:10px;border-radius:3px}
.legend b{font-variant-numeric:tabular-nums}
/* chart */
.chart svg{width:100%;height:auto;max-height:240px;display:block}
.keys{display:flex;gap:16px;font-size:12.5px;color:var(--muted)}
.keys span{display:flex;align-items:center;gap:6px}
.keys i{width:9px;height:9px;border-radius:50%}
/* alert */
.alert{border-radius:16px;padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.alert.warn{background:var(--warn-soft);color:var(--warn)}
.alert.good{background:var(--ok-soft);color:var(--ok)}
.btn{font:600 13px var(--font);border-radius:10px;padding:8px 12px;border:0;cursor:pointer;background:var(--accent);color:var(--accent-fg);white-space:nowrap}
.btn.ghost{background:transparent;color:inherit;border:1.5px solid currentColor}
.btn.soft{background:var(--accent-soft);color:var(--accent)}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* schedule */
.sched{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;min-width:600px}
th{font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:0 10px 10px}
td{padding:11px 10px;border-top:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right;white-space:nowrap}
.m{font-weight:700}
.pin{width:120px;border:1.5px solid var(--line);border-radius:10px;padding:6px 9px;background:var(--panel);color:var(--fg);font:600 14px var(--font);text-align:right;font-variant-numeric:tabular-nums}
.pin:focus{border-color:var(--accent);outline:none}
.pill{font-size:12px;font-weight:700;border-radius:999px;padding:4px 10px;white-space:nowrap;display:inline-block}
.pill.paid{background:var(--ok-soft);color:var(--ok)} .pill.part{background:var(--part-soft);color:var(--part)}
.pill.late{background:var(--warn-soft);color:var(--warn)} .pill.now{background:var(--accent);color:var(--accent-fg)} .pill.todo{background:var(--accent-soft);color:var(--accent)}
.mini{height:5px;border-radius:5px;background:var(--track);overflow:hidden;width:90px;margin-top:6px}
.mini i{display:block;height:100%;background:var(--ok)}
/* choice */
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{text-align:left;font:inherit;color:inherit;background:var(--panel);border:1.5px solid var(--line);border-radius:16px;padding:16px;cursor:pointer;display:grid;gap:4px}
.opt.on{border-color:var(--accent);background:var(--accent-soft)}
.opt .t{font-weight:700}
.opt .p{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.note{font-size:13px;color:var(--muted);margin-top:10px}
/* reserva para compra */
.buytop{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.buytop .box{background:var(--panel);border-radius:16px;padding:14px;display:grid;gap:4px;min-width:0}
.buytop .box .big{font-size:22px}
.buybar{height:10px;border-radius:10px;background:var(--track);overflow:hidden;margin:14px 0 6px}
.buybar i{display:block;height:100%;background:var(--ok);border-radius:10px}
.buyform{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-top:14px}
.buyform label{display:grid;gap:4px;font-size:12px;font-weight:600;color:var(--muted)}
.buyform input{border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--panel);color:var(--fg);font:600 14px var(--font);min-width:0}
.buyform input:focus{border-color:var(--accent);outline:none}
.deps{display:grid;margin-top:12px}
.dep{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.dep b{white-space:nowrap}
.linkbtn{background:none;border:0;color:var(--warn);font:600 12.5px var(--font);cursor:pointer;padding:4px}
@media (max-width:560px){.buytop{grid-template-columns:1fr}}

/* dados (backup) */
.sheet{width:min(440px,100%);background:var(--card);color:var(--fg);border-radius:24px;padding:20px;box-shadow:0 30px 60px -20px rgba(0,0,0,.45);display:grid;gap:14px}
.sheet p{margin:0;color:var(--muted);font-size:13.5px}
.sheet .btn{width:100%;padding:12px;font-size:14px}
.sheet .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sheet .info{background:var(--panel);border-radius:14px;padding:12px 14px;font-size:13px;display:grid;gap:4px}
.sheet .msg{border-radius:12px;padding:10px 12px;font-size:13px}
.sheet .msg.ok{background:var(--ok-soft);color:var(--ok)} .sheet .msg.bad{background:var(--warn-soft);color:var(--warn)}
@media (max-width:820px){
  .outer{padding-top:max(14px,env(safe-area-inset-top,0px));padding-bottom:calc(86px + env(safe-area-inset-bottom,0px))}
  .shell{background:none;padding:0;border-radius:0;grid-template-columns:minmax(0,1fr)}
  aside{position:fixed;left:0;right:0;bottom:0;top:auto;height:auto;z-index:20;border-radius:20px 20px 0 0;overflow:visible;
    padding:6px max(8px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-right,0px));
    flex-direction:row;box-shadow:0 -8px 30px -18px rgba(20,24,60,.45);border-top:1px solid var(--line)}
  .brand,.promo,.menu .cap,.deskonly{display:none!important}
  .menu{grid-auto-flow:column;grid-auto-columns:1fr;width:100%;gap:2px;overflow:visible}
  .menu a,.menu button{flex-direction:column;justify-content:center;gap:3px;font-size:10.5px;font-weight:600;padding:7px 2px;width:auto;text-align:center;color:var(--muted);border-radius:12px}
  .menu a.on{background:var(--accent-soft);color:var(--accent);box-shadow:none}
  .menu svg{width:21px;height:21px}
  .lg{display:none}.sm{display:inline}
  .mbrand{display:block;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
  h1{font-size:21px}.date{display:none}
  .top{flex-wrap:nowrap}.tools{gap:8px}.save{display:none}.who{display:none}
  main{padding:0;gap:12px}
  .card{border-radius:20px;padding:16px}
  input,.pin,.buyform input{font-size:16px!important}
  .alert .btn{width:100%}
  .chart svg{max-height:200px}
}
@media (max-width:640px){
  .sched tr{grid-template-columns:auto minmax(0,1fr) auto;gap:10px 10px}
  .sched td:nth-child(1){grid-column:1/3}
  .sched td:nth-child(2){grid-column:3;text-align:right}
  .sched td:nth-child(3){grid-column:1;text-align:left}
  .sched td:nth-child(4){grid-column:2;justify-self:start}
  .sched td:nth-child(5){grid-column:3;text-align:right}
  .sched .pill{white-space:normal;line-height:1.3}
  .sched .pin{width:104px;text-align:left}
}
@media (max-width:400px){.big{font-size:23px}.ringwrap svg{width:150px;height:150px}}
/* acesso */
body.locked .outer{display:none}
body:not(.locked) .auth{display:none}
.auth{min-height:100vh;display:grid;place-items:center;padding-top:max(24px,env(safe-area-inset-top,0px));padding-bottom:max(24px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.authcard{width:min(380px,100%);background:var(--card);border-radius:26px;padding:26px 22px;display:grid;gap:14px;box-shadow:0 30px 60px -30px rgba(20,24,60,.35)}
.authcard .logo{width:46px;height:46px;border-radius:14px}
.authcard h2{font-size:22px}
.authcard p{margin:0;color:var(--muted);font-size:13.5px}
.authcard label{display:grid;gap:6px;font-weight:600;font-size:13px}
.authcard input{border:1.5px solid var(--line);border-radius:12px;padding:12px 13px;font:500 16px var(--font);background:var(--panel);color:var(--fg);width:100%}
.authcard input:focus{border-color:var(--accent);outline:none}
.authcard .btn{padding:13px;font-size:15px;width:100%}
.authcard .err{color:var(--warn);font-size:13px;min-height:18px}
.authcard .warnbox{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:13px}
.linkish{background:none;border:0;color:var(--muted);font:600 13px var(--font);cursor:pointer;text-decoration:underline;justify-self:center;padding:4px}
/* calculadora */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(10,12,24,.45);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:grid;place-items:center;padding:16px}
.calc{width:min(320px,100%);background:var(--card);color:var(--fg);border-radius:24px;padding:18px;box-shadow:0 30px 60px -20px rgba(0,0,0,.45);display:grid;gap:12px}
.calc .ch{display:flex;justify-content:space-between;align-items:center}
.calc .x{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer;font-size:18px;line-height:1}
.screen{background:var(--panel);border-radius:16px;padding:12px 14px;text-align:right;min-height:78px;display:grid;align-content:end;overflow:hidden}
.screen .ex{font-size:13px;color:var(--muted);min-height:18px;word-break:break-all}
.screen .res{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;word-break:break-all;line-height:1.15}
.keys4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.keys4 button{height:52px;border-radius:14px;border:0;background:var(--panel);color:var(--fg);font:700 18px var(--font);cursor:pointer}
.keys4 button:active{transform:scale(.97)}
.keys4 .op{background:var(--accent-soft);color:var(--accent)}
.keys4 .eq{background:var(--accent);color:var(--accent-fg)}
.keys4 .fn{color:var(--muted)}
.keys4 .zero{grid-column:span 2}
@media (max-width:980px){.grid{grid-template-columns:1fr}}
@media (max-width:640px){
  table{min-width:0} thead{display:none}
  tbody,tr,td{display:block} tr{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
  td{border:0;padding:0} td:nth-child(2){text-align:right} td:nth-child(2)::before{content:"previsto ";color:var(--muted);font-size:12px}
  td:empty{display:none} .pin{width:110px}
}
@media (max-width:560px){.stats,.opts{grid-template-columns:1fr}.ringwrap{grid-template-columns:1fr;justify-items:center}.who span{display:none}}
</style>
</head>
<body class="locked">
<div class="auth" id="auth"></div>
<div class="outer"><div class="shell">
<aside>
  <div class="brand"><div class="logo"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="8"></circle><circle cx="12" cy="12" r="3.2"></circle></svg></div><div><small>Lente</small>Canon RF 70-200 f/2.8</div></div>
  <nav class="menu">
    <div class="cap">Menu</div>
    <a href="#resumo" class="on" data-spy="resumo"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="2"></rect><rect x="14" y="3" width="7" height="7" rx="2"></rect><rect x="3" y="14" width="7" height="7" rx="2"></rect><rect x="14" y="14" width="7" height="7" rx="2"></rect></svg><span class="lg">Resumo</span><span class="sm">Resumo</span></a>
    <a href="#pagamentos" data-spy="pagamentos"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="3"></rect><path d="M3 10h18"></path></svg><span class="lg">Pagamentos</span><span class="sm">Pagamentos</span></a>
    <a href="#contrato" data-spy="contrato"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 3h7l5 5v13H7z"></path><path d="M14 3v5h5"></path></svg><span class="lg">Fim do contrato</span><span class="sm">Contrato</span></a>

          '<div class="legend">'+
            '<div><i style="background:var(--accent)"></i><span>Prazo decorrido</span><b>'+(c.tp*100).toFixed(0)+'%</b><span class="badge a">'+Math.min(24,Math.floor(c.tp*24)+1)+'/24 meses</span></div>'+
            '<div><i style="background:var(--ok)"></i><span>Valor pago</span><b>'+brl(c.paid)+'</b><span class="badge g">'+(c.vp*100).toFixed(0)+'%</span></div>'+
            '<div><i style="background:var(--warn)"></i><span>Falta pagar</span><b>'+brl(c.remaining)+'</b><span class="badge r">'+(c.remaining/TOTAL*100).toFixed(0)+'%</span></div>'+

    document.getElementById("theme").onclick = toggleTheme;

  /* ---------- salvar neste aparelho ---------- */
  function valid(o){ return o && typeof o==="object" && +o.monthly>0 && o.paid && typeof o.paid==="object"; }
  /* ---------- cofre: dados cifrados com a senha (AES-GCM, chave via PBKDF2) ---------- */
  var LV = "lente-vault-v1", KEY = null, SALT = null, EMAIL = "", VAULT = null, ITER = 250000;
  var TE = new TextEncoder(), TD = new TextDecoder();
  function b64(buf){ var b = new Uint8Array(buf), t = ""; for (var i=0;i<b.length;i++) t += String.fromCharCode(b[i]); return btoa(t); }
  function unb64(t){ var b = atob(t), u = new Uint8Array(b.length); for (var i=0;i<b.length;i++) u[i] = b.charCodeAt(i); return u; }
  function derive(pass, salt, iter){
    return crypto.subtle.importKey("raw", TE.encode(pass), "PBKDF2", false, ["deriveKey"]).then(function(base){
      return crypto.subtle.deriveKey({name:"PBKDF2", salt:salt, iterations:iter, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]);
    });
  }
  function seal(obj){
    var iv = crypto.getRandomValues(new Uint8Array(12));
    return crypto.subtle.encrypt({name:"AES-GCM", iv:iv}, KEY, TE.encode(JSON.stringify(obj))).then(function(ct){
      return {v:1, email:EMAIL, salt:b64(SALT), iter:ITER, iv:b64(iv), ct:b64(ct), updated:obj.updated||0};
    });
  }
  function unseal(vault, pass){
    var salt = unb64(vault.salt);
    return derive(pass, salt, vault.iter||ITER).then(function(key){
      return crypto.subtle.decrypt({name:"AES-GCM", iv:unb64(vault.iv)}, key, unb64(vault.ct)).then(function(pt){
        return {state: JSON.parse(TD.decode(pt)), key:key, salt:salt};
      });
    });
  }
  function norm(o){ if (!o.paid) o.paid = {}; if (!o.buy) o.buy = []; if (!(+o.monthly>0)) o.monthly = 2500; return o; }
  function persist(){
    if (!KEY) return Promise.resolve();
    return seal(state).then(function(v){
      VAULT = v;
      try { localStorage.setItem(LV, JSON.stringify(v)); localStorage.removeItem(LS); mode = "local"; } catch(e){ mode = "error"; }
    }).catch(function(){ mode = "error"; });
  }
  function changed(){ state.updated = Date.now(); render(); persist().then(function(){ if (mode==="error") render(); }); }
  function when(t){ if (!t) return "sem data"; var d=new Date(t); return d.toLocaleDateString("pt-BR")+" às "+d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}); }
  function stamp(){ var d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }

  /* ---------- backup: exportar e importar ---------- */
  function exportHtml(){
    var json = JSON.stringify(VAULT).replace(/</g,"\\u003c");
    return SRC.replace(/(<script id="vault" type="application\/json">)[\s\S]*?(<\/script>)/, function(m,a,b){ return a+json+b; });
  }
  function doExport(note){
    if (!VAULT) return note("bad","Ainda salvando, tente de novo em instantes.");
    var name = "controle-lente-"+stamp()+".html";
    var blob = new Blob([exportHtml()], {type:"text/html"});
    var file = null;
    try { file = new File([blob], name, {type:"text/html"}); } catch(e){}
    if (file && navigator.canShare && navigator.canShare({files:[file]})) {
      navigator.share({files:[file], title:"Controle da Lente"}).then(function(){ note("ok","Cópia pronta. Escolha “Salvar em Arquivos” ou envie para o notebook."); })
        .catch(function(e){ if (!e || e.name!=="AbortError") fallback(); });
    } else fallback();
    function fallback(){
      var a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);
      note("ok","Arquivo "+name+" baixado.");
    }
  }
  function parseFile(text){
    var t = text.trim(), obj = null;
    if (t.charAt(0)==="{") obj = JSON.parse(t);
    else {
      var doc = new DOMParser().parseFromString(text, "text/html");
      var ve = doc.getElementById("vault"), v = null;
      try { v = ve ? JSON.parse(ve.textContent) : null; } catch(e){}
      if (v && v.ct) return {vault:v};
      var el = doc.getElementById("state");
      if (el) obj = JSON.parse(el.textContent);
    }
    if (obj && obj.ct) return {vault:obj};
    if (!valid(obj) || !obj.updated) throw new Error("bad");
    return {state:norm(obj)};
  }
  function openData(){
    if (document.getElementById("dataOv")) return;
    var ov = document.createElement("div"); ov.className="overlay"; ov.id="dataOv";
    ov.innerHTML = '<div class="sheet" role="dialog" aria-modal="true" aria-label="Backup dos dados">'+
      '<div class="chead" style="margin:0"><h2>Backup dos dados</h2><button class="iconbtn" id="dClose" aria-label="Fechar" style="width:34px;height:34px">×</button></div>'+
      '<p>Os dados ficam só neste aparelho. Para levar ao celular ou ao notebook, exporte uma cópia aqui e importe o arquivo no outro aparelho.</p>'+
      '<div class="info"><span><b>Última alteração:</b> '+when(state.updated)+'</span><span><b>Já pago:</b> '+brl(calc().paid)+' · <b>Guardado para compra:</b> '+brl(state.buy.reduce(function(s,x){return s+(+x.v||0);},0))+'</span></div>'+
      '<div class="row2"><button class="btn" id="dExport">Exportar cópia</button><button class="btn soft" id="dImport">Importar arquivo</button></div>'+
      '<input type="file" id="dFile" accept=".html,.htm,.json,text/html,application/json" hidden>'+
      '<div id="dMsg"></div></div>';
    document.body.appendChild(ov);
    function note(kind, html){ document.getElementById("dMsg").innerHTML = '<div class="msg '+kind+'">'+html+'</div>'; }
    ov.addEventListener("click", function(e){ if (e.target===ov) closeData(); });
    document.getElementById("dClose").onclick = closeData;
    document.getElementById("dExport").onclick = function(){ doExport(note); };
    document.getElementById("dImport").onclick = function(){ document.getElementById("dFile").click(); };
    document.getElementById("dFile").onchange = function(){
      var f = this.files && this.files[0]; this.value = "";
      if (!f) return;
      var r = new FileReader();
      r.onload = function(){
        var got;
        try { got = parseFile(String(r.result)); }
        catch(e){ return note("bad","Não encontrei dados do controle nesse arquivo. Use um arquivo exportado por este app."); }
        if (got.state) return confirmImport(got.state);
        note("ok", 'Arquivo protegido. Digite a senha usada nele.'+
          '<input type="password" id="dPass" autocomplete="current-password" style="margin-top:8px;width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px;font:500 16px var(--font);background:var(--card);color:var(--fg)">'+
          '<button class="btn" id="dOpen" style="margin-top:8px">Abrir arquivo</button>');
        document.getElementById("dPass").focus();
        document.getElementById("dOpen").onclick = function(){
          unseal(got.vault, document.getElementById("dPass").value).then(function(o){ confirmImport(norm(o.state)); })
            .catch(function(){ note("bad","Senha incorreta para esse arquivo."); });
        };
      };
      r.readAsText(f);
    };
    function confirmImport(obj){
        var older = (obj.updated||0) < (state.updated||0);
        note(older ? "bad" : "ok",
          'Arquivo salvo em <b>'+when(obj.updated)+'</b>.'+(older?' Ele é mais antigo que os dados deste aparelho.':'')+
          '<div class="row2" style="margin-top:10px"><button class="btn" id="dApply">Substituir dados</button><button class="btn ghost" id="dCancel">Cancelar</button></div>');
        document.getElementById("dApply").onclick = function(){
          state = obj; state.updated = Date.now();
          persist(); render(); closeData();
        };
        document.getElementById("dCancel").onclick = function(){ document.getElementById("dMsg").innerHTML = ""; };
    }
    document.addEventListener("keydown", dataKeys);
  }
  function dataKeys(e){ if (e.key==="Escape") closeData(); }
  function closeData(){ var ov=document.getElementById("dataOv"); if (ov) ov.remove(); document.removeEventListener("keydown", dataKeys); }

  /* ---------- menu acompanha a seção visível ---------- */
  function spy(){
    var ids = ["resumo","pagamentos","contrato","compra"], cur = "resumo";
    ids.forEach(function(id){ var el=document.getElementById(id); if (el && el.getBoundingClientRect().top < innerHeight*0.4) cur = id; });
    if ((innerHeight + scrollY) >= document.documentElement.scrollHeight - 4) cur = "compra";
    document.querySelectorAll("[data-spy]").forEach(function(a){ a.classList.toggle("on", a.dataset.spy===cur); });
  }
  window.addEventListener("scroll", spy, {passive:true});

  /* ---------- calculadora ---------- */
  var cx = {expr:"", last:""};
  function evalExpr(str){
    var t = str.replace(/,/g,".").match(/\d*\.?\d+|[-+*\/]/g) || [], i = 0;
    function num(){ var tk=t[i++]; if (tk==="-") return -num(); if (tk==="+") return num(); var v=parseFloat(tk); if (isNaN(v)) throw 0; return v; }
    function term(){ var v=num(); while(t[i]==="*"||t[i]==="/"){ var o=t[i++], r=num(); v = o==="*" ? v*r : v/r; } return v; }
    function expr(){ var v=term(); while(t[i]==="+"||t[i]==="-"){ var o=t[i++], r=term(); v = o==="+" ? v+r : v-r; } return v; }
    var v = expr(); if (i < t.length || !isFinite(v)) throw 0; return v;
  }
  function fmt(v){ return (Math.round(v*1e8)/1e8).toLocaleString("pt-BR",{maximumFractionDigits:8}); }
  function show(){ var sym = cx.expr.replace(/\*/g,"×").replace(/\//g,"÷").replace(/-/g,"−").replace(/\./g,",");
    document.getElementById("cEx").textContent = cx.last; document.getElementById("cRes").textContent = sym || "0"; }
  function press(k){
    var ops = "+-*/";
    if (k==="C") { cx.expr=""; cx.last=""; }
    else if (k==="back") cx.expr = cx.expr.slice(0,-1);
    else if (k==="=") { if (!cx.expr) return; try { var v = evalExpr(cx.expr); cx.last = cx.expr.replace(/\*/g,"×").replace(/\//g,"÷").replace(/-/g,"−").replace(/\./g,",")+" ="; cx.expr = String(Math.round(v*1e8)/1e8); } catch(e){ cx.last="Conta incompleta"; } }
    else if (k==="%") { var m = cx.expr.match(/(\d*\.?\d+)$/); if (m) cx.expr = cx.expr.slice(0,-m[1].length) + String(parseFloat(m[1])/100); }
    else if (ops.indexOf(k)>=0) { if (!cx.expr && k!=="-") return; if (ops.indexOf(cx.expr.slice(-1))>=0) cx.expr = cx.expr.slice(0,-1); cx.expr += k; }
    else if (k===".") { var seg = cx.expr.split(/[-+*\/]/).pop(); if (seg.indexOf(".")<0) cx.expr += seg ? "." : "0."; }
    else cx.expr += k;
    show();
  }
  function openCalc(){
    if (document.getElementById("calcOv")) return;
    var ov = document.createElement("div"); ov.className="overlay"; ov.id="calcOv";
    var K = [["C","C","fn"],["back","⌫","fn"],["%","%","fn"],["/","÷","op"],["7","7"],["8","8"],["9","9"],["*","×","op"],["4","4"],["5","5"],["6","6"],["-","−","op"],["1","1"],["2","2"],["3","3"],["+","+","op"],["0","0","zero"],[".",","],["=","=","eq"]];
    ov.innerHTML = '<div class="calc" role="dialog" aria-modal="true" aria-label="Calculadora"><div class="ch"><h2>Calculadora</h2><button class="x" id="cClose" aria-label="Fechar">×</button></div>'+
      '<div class="screen"><div class="ex" id="cEx"></div><div class="res" id="cRes">0</div></div><div class="keys4">'+
      K.map(function(k){ return '<button type="button" data-key="'+k[0]+'" class="'+(k[2]||"")+'">'+k[1]+'</button>'; }).join("")+'</div></div>';
    document.body.appendChild(ov);
    ov.addEventListener("click", function(e){ if (e.target===ov) closeCalc(); var b=e.target.closest("[data-key]"); if (b) press(b.dataset.key); });
    document.getElementById("cClose").onclick = closeCalc;
    document.addEventListener("keydown", calcKeys);
    show(); document.getElementById("cClose").focus();
  }
  function closeCalc(){ var ov=document.getElementById("calcOv"); if (ov) ov.remove(); document.removeEventListener("keydown", calcKeys); }
  function calcKeys(e){
    var k = e.key;
    if (k==="Escape") return closeCalc();
    if (/^[0-9]$/.test(k) || "+-*/%".indexOf(k)>=0) press(k);
    else if (k==="," || k===".") press(".");
    else if (k==="Enter" || k==="=") { e.preventDefault(); press("="); }
    else if (k==="Backspace") press("back");
    else if (k==="Delete" || k==="c" || k==="C") press("C");
    else return;
    e.preventDefault();
  }
  document.getElementById("openCalc").onclick = openCalc;

  document.getElementById("openData2").onclick = openData;

  /* ---------- tela de acesso ---------- */
  var AUTHBRAND = '<div class="logo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="8"></circle><circle cx="12" cy="12" r="3.2"></circle></svg></div>';
  function authEl(){ return document.getElementById("auth"); }
  function showLogin(){
    authEl().innerHTML = '<form class="authcard" id="loginForm" autocomplete="on">'+AUTHBRAND+
      '<div><h2>Controle da Lente</h2><p>Entre para ver seus pagamentos.</p></div>'+
      '<label for="lEmail">E-mail<input id="lEmail" type="email" autocomplete="username" required></label>'+
      '<label for="lPass">Senha<input id="lPass" type="password" autocomplete="current-password" required></label>'+
      '<div class="err" id="lErr"></div><button class="btn" type="submit" id="lBtn">Entrar</button>'+
      '<button class="linkish" type="button" id="lForgot">Esqueci a senha</button></form>';
    var em = document.getElementById("lEmail"); em.value = VAULT && VAULT.email || "";
    (em.value ? document.getElementById("lPass") : em).focus();
    document.getElementById("loginForm").onsubmit = function(e){
      e.preventDefault();
      var btn = document.getElementById("lBtn"), err = document.getElementById("lErr");
      var mail = em.value.trim().toLowerCase(), pass = document.getElementById("lPass").value;
      btn.disabled = true; btn.textContent = "Entrando…"; err.textContent = "";
      var fail = function(){ btn.disabled = false; btn.textContent = "Entrar"; err.textContent = "E-mail ou senha incorretos."; };
      if (mail !== (VAULT.email||"").toLowerCase()) return setTimeout(fail, 400);
      unseal(VAULT, pass).then(function(o){ KEY = o.key; SALT = o.salt; EMAIL = VAULT.email; ITER = VAULT.iter||ITER; state = norm(o.state); unlock(); }).catch(fail);
    };
    document.getElementById("lForgot").onclick = showForgot;
  }
  function showForgot(){
    authEl().innerHTML = '<div class="authcard">'+AUTHBRAND+'<div><h2>Esqueci a senha</h2>'+
      '<p>A senha não fica guardada em lugar nenhum, então não dá para recuperá-la. Sem ela, os dados deste aparelho não podem ser abertos.</p></div>'+
      '<div class="warnbox">Se continuar, os dados deste aparelho serão apagados. Depois você cria um acesso novo e pode importar um backup, desde que lembre a senha dele.</div>'+
      '<button class="btn" id="fWipe" style="background:var(--warn)">Apagar dados deste aparelho</button>'+
      '<button class="linkish" id="fBack">Voltar</button></div>';
    document.getElementById("fBack").onclick = showLogin;
    document.getElementById("fWipe").onclick = function(){
      try { localStorage.removeItem(LV); localStorage.removeItem(LS); } catch(e){}
      VAULT = null; state = norm(JSON.parse(document.getElementById("state").textContent)); showCreate();
    };
  }
  function showCreate(){
    authEl().innerHTML = '<form class="authcard" id="newForm" autocomplete="on">'+AUTHBRAND+
      '<div><h2>Criar acesso</h2><p>Escolha um e-mail e uma senha para proteger os dados deste aparelho. Os dados ficam cifrados com essa senha.</p></div>'+
      '<label for="nEmail">E-mail<input id="nEmail" type="email" autocomplete="username" required></label>'+
      '<label for="nPass">Senha (mínimo 8 caracteres)<input id="nPass" type="password" autocomplete="new-password" minlength="8" required></label>'+
      '<label for="nPass2">Repita a senha<input id="nPass2" type="password" autocomplete="new-password" required></label>'+
      '<div class="err" id="nErr"></div><button class="btn" type="submit" id="nBtn">Criar acesso</button></form>';
    document.getElementById("nEmail").focus();
    document.getElementById("newForm").onsubmit = function(e){
      e.preventDefault();
      var mail = document.getElementById("nEmail").value.trim(), p1 = document.getElementById("nPass").value, p2 = document.getElementById("nPass2").value;
      var err = document.getElementById("nErr");
      if (mail.indexOf("@") < 1) return err.textContent = "Digite um e-mail válido.";
      if (p1.length < 8) return err.textContent = "A senha precisa ter pelo menos 8 caracteres.";
      if (p1 !== p2) return err.textContent = "As duas senhas não são iguais.";
      var btn = document.getElementById("nBtn"); btn.disabled = true; btn.textContent = "Criando…";
      SALT = crypto.getRandomValues(new Uint8Array(16)); EMAIL = mail;
      derive(p1, SALT, ITER).then(function(k){
        KEY = k;
        // aproveita dados de uma versão anterior sem senha, se existirem neste aparelho
        try { var old = JSON.parse(localStorage.getItem(LS) || "null"); if (valid(old)) state = norm(old); } catch(e){}
        state.updated = state.updated || Date.now();
        return persist();
      }).then(unlock);
    };
  }
  function unlock(){
    authEl().innerHTML = "";
    document.body.classList.remove("locked");
    persist(); render(); spy();
  }
  function lock(){
    KEY = null; SALT = null;
    state = norm(JSON.parse(document.getElementById("state").textContent));
    closeData(); closeCalc();
    document.getElementById("app").innerHTML = "";
    document.body.classList.add("locked");
    window.scrollTo(0,0);
    showLogin();
  }
  document.getElementById("logout2").onclick = lock;
  // bloqueia sozinho depois de 5 minutos fora do app
  var hiddenAt = 0;
  document.addEventListener("visibilitychange", function(){
    if (document.hidden) hiddenAt = Date.now();
    else if (KEY && hiddenAt && Date.now() - hiddenAt > 5*60*1000) lock();
  });

  var embedded = null, localV = null;
  try { embedded = JSON.parse(document.getElementById("vault").textContent); } catch(e){}
  try { localV = JSON.parse(localStorage.getItem(LV) || "null"); } catch(e){}
  VAULT = localV && localV.ct ? localV : null;
  if (embedded && embedded.ct && (!VAULT || (embedded.updated||0) > (VAULT.updated||0))) VAULT = embedded;
  if (!window.crypto || !crypto.subtle) {
    authEl().innerHTML = '<div class="authcard"><h2>Navegador sem suporte</h2><p>Abra o controle no Safari, Chrome ou Edge atualizados.</p></div>';
  } else if (VAULT) showLogin(); else showCreate();

  if ("serviceWorker" in navigator && location.protocol === "https:") {
    navigator.serviceWorker.register("sw.js").catch(function(){});
  }
})();
</script>
</body>
