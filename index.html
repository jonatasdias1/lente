<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Controle Financeiro</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Finanças">
<meta name="theme-color" content="#e9ebf2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0c12" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style id="css">
/* Layout: painel com barra lateral, cartões de números, anel de progresso, gráfico mensal e cronograma */
:root{
  --bg:#e9ebf2; --panel:#f5f6fa; --card:#ffffff; --fg:#161827; --muted:#7a7f95; --line:#e7e9f0; --track:#dfe1ea;
  --accent:#4352ec; --accent-fg:#ffffff; --accent-soft:#eceefe;
  --ok:#1a9a52; --ok-soft:#ddf6e6; --warn:#e5484d; --warn-soft:#fde8e8; --part:#c97a09; --part-soft:#fdf1dc;
  --ink:#16171f; --ink-fg:#ffffff;
  --font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b0c12; --panel:#12141d; --card:#1a1d2a; --fg:#eceef6; --muted:#9097ae; --line:#272a3a; --track:#2c3043;
  --accent:#6d79ff; --accent-fg:#ffffff; --accent-soft:#252a52;
  --ok:#43d17f; --ok-soft:#163323; --warn:#ff6b6f; --warn-soft:#3b1a1d; --part:#f0a63a; --part-soft:#3a2b12;
  --ink:#262a3c; --ink-fg:#ffffff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b0c12; --panel:#12141d; --card:#1a1d2a; --fg:#eceef6; --muted:#9097ae; --line:#272a3a; --track:#2c3043;
  --accent:#6d79ff; --accent-fg:#ffffff; --accent-soft:#252a52;
  --ok:#43d17f; --ok-soft:#163323; --warn:#ff6b6f; --warn-soft:#3b1a1d; --part:#f0a63a; --part-soft:#3a2b12;
  --ink:#262a3c; --ink-fg:#ffffff; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
.sm,.mbrand{display:none}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.45}
.outer{padding-top:max(24px,env(safe-area-inset-top,0px));padding-bottom:max(24px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.shell{max-width:1180px;margin:0 auto;background:var(--panel);border-radius:28px;padding:16px;display:grid;grid-template-columns:210px minmax(0,1fr);gap:20px}
/* sidebar */
aside{background:var(--card);border-radius:22px;padding:20px 14px;display:flex;flex-direction:column;gap:22px;position:sticky;top:calc(16px + env(safe-area-inset-top,0px));align-self:start;height:calc(100vh - 56px);overflow-y:auto;z-index:5;box-shadow:0 10px 30px -22px rgba(20,24,60,.35)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;padding:0 6px;line-height:1.25}
.brand small{display:block;font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.logo{flex:none}
.logo{width:30px;height:30px;border-radius:9px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center}
.menu{display:grid;gap:4px}
.menu .cap{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:0 8px 4px}
.menu a,.menu button{font:500 14px var(--font);background:none;border:0;cursor:pointer;text-align:left;width:100%;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;color:var(--fg);text-decoration:none;font-weight:500}
.menu button:hover,.menu a:hover{background:var(--accent-soft)}
.menu a.on{background:var(--accent);color:var(--accent-fg);box-shadow:0 8px 18px -8px var(--accent)}
.promo{margin-top:auto;background:var(--ink);color:var(--ink-fg);border-radius:18px;padding:16px;display:grid;gap:8px}
.promo .small{font-size:12px;opacity:.72}
.promo .val{font-size:18px;font-weight:800}
/* main */
main{display:grid;gap:16px;min-width:0;padding:6px 4px 4px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-size:24px;font-weight:800;margin:0;letter-spacing:-.02em}
.date{color:var(--muted);font-size:13px;margin-top:2px}
.tools{display:flex;align-items:center;gap:10px}
.iconbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--fg);display:grid;place-items:center;cursor:pointer}
.save{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 12px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.save.ok .dot{background:var(--ok)} .save.busy .dot{background:var(--accent)} .save.err .dot{background:var(--warn)}
.who{display:flex;align-items:center;gap:8px;font-weight:600}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:800}
.grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card{background:var(--card);border-radius:22px;padding:18px;min-width:0}
.stat{display:flex;flex-direction:column;gap:6px}
.stat .row1{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
.ico{width:40px;height:40px;border-radius:12px;background:var(--panel);display:grid;place-items:center;color:var(--fg)}
.stat.hero{background:var(--accent);color:var(--accent-fg);box-shadow:0 18px 30px -18px var(--accent)}
.stat.hero .ico{background:#ffffff;color:var(--accent)}
.stat.hero .muted{color:rgba(255,255,255,.78)}
.badge{font-size:11.5px;font-weight:700;border-radius:999px;padding:3px 9px;white-space:nowrap}
.badge.g{background:var(--ok-soft);color:var(--ok)} .badge.r{background:var(--warn-soft);color:var(--warn)}
.badge.w{background:rgba(255,255,255,.22);color:#fff} .badge.a{background:var(--accent-soft);color:var(--accent)}
.lbl{font-weight:600;font-size:13px}
.num{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.big{font-size:26px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.muted{color:var(--muted);font-size:12px}
.money{display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:12px;padding:3px 10px;background:var(--panel)}
.money:focus-within{border-color:var(--accent)}
.money span{color:var(--muted);font-weight:600;font-size:13px}
.money input{border:0;background:transparent;color:var(--fg);font:800 22px var(--font);width:100%;min-width:0;outline:none;font-variant-numeric:tabular-nums}
h2{font-size:17px;font-weight:700;margin:0}
.chead{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.chip{font-size:12px;font-weight:600;border:1px solid var(--line);border-radius:10px;padding:6px 10px;color:var(--muted)}
/* rings */
.ringwrap{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.ringwrap svg{width:170px;height:170px;max-width:100%}
.ringtxt .big{font-size:30px}
.legend{display:grid;gap:12px;margin-top:16px}
.legend div{display:grid;grid-template-columns:12px 1fr auto auto;gap:10px;align-items:center;font-weight:600}
.legend i{width:10px;height:10px;border-radius:3px}
.legend b{font-variant-numeric:tabular-nums}
/* chart */
.chart svg{width:100%;height:auto;max-height:240px;display:block}
.keys{display:flex;gap:16px;font-size:12.5px;color:var(--muted)}
.keys span{display:flex;align-items:center;gap:6px}
.keys i{width:9px;height:9px;border-radius:50%}
/* alert */
.alert{border-radius:16px;padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.alert.warn{background:var(--warn-soft);color:var(--warn)}
.alert.good{background:var(--ok-soft);color:var(--ok)}
.btn{font:600 13px var(--font);border-radius:10px;padding:8px 12px;border:0;cursor:pointer;background:var(--accent);color:var(--accent-fg);white-space:nowrap}
.btn.ghost{background:transparent;color:inherit;border:1.5px solid currentColor}
.btn.soft{background:var(--accent-soft);color:var(--accent)}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* schedule */
.sched{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;min-width:600px}
th{font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:0 10px 10px}
td{padding:11px 10px;border-top:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right;white-space:nowrap}
.m{font-weight:700}
.pin{width:120px;border:1.5px solid var(--line);border-radius:10px;padding:6px 9px;background:var(--panel);color:var(--fg);font:600 14px var(--font);text-align:right;font-variant-numeric:tabular-nums}
.pin:focus{border-color:var(--accent);outline:none}
.pill{font-size:12px;font-weight:700;border-radius:999px;padding:4px 10px;white-space:nowrap;display:inline-block}
.pill.paid{background:var(--ok-soft);color:var(--ok)} .pill.part{background:var(--part-soft);color:var(--part)}
.pill.late{background:var(--warn-soft);color:var(--warn)} .pill.now{background:var(--accent);color:var(--accent-fg)} .pill.todo{background:var(--accent-soft);color:var(--accent)}
.mini{height:5px;border-radius:5px;background:var(--track);overflow:hidden;width:90px;margin-top:6px}
.mini i{display:block;height:100%;background:var(--ok)}
/* choice */
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{text-align:left;font:inherit;color:inherit;background:var(--panel);border:1.5px solid var(--line);border-radius:16px;padding:16px;cursor:pointer;display:grid;gap:4px}
.opt.on{border-color:var(--accent);background:var(--accent-soft)}
.opt .t{font-weight:700}
.opt .p{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.note{font-size:13px;color:var(--muted);margin-top:10px}
/* reserva para compra */
.buytop{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.buytop .box{background:var(--panel);border-radius:16px;padding:14px;display:grid;gap:4px;min-width:0}
.buytop .box .big{font-size:22px}
.buybar{height:10px;border-radius:10px;background:var(--track);overflow:hidden;margin:14px 0 6px}
.buybar i{display:block;height:100%;background:var(--ok);border-radius:10px}
.buyform{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-top:14px}
.buyform label{display:grid;gap:4px;font-size:12px;font-weight:600;color:var(--muted)}
.buyform input{border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--panel);color:var(--fg);font:600 14px var(--font);min-width:0}
.buyform input:focus{border-color:var(--accent);outline:none}
.deps{display:grid;margin-top:12px}
.dep{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.dep b{white-space:nowrap}
.linkbtn{background:none;border:0;color:var(--warn);font:600 12.5px var(--font);cursor:pointer;padding:4px}
@media (max-width:560px){.buytop{grid-template-columns:1fr}}

/* dados (backup) */
.sheet{width:min(440px,100%);background:var(--card);color:var(--fg);border-radius:24px;padding:20px;box-shadow:0 30px 60px -20px rgba(0,0,0,.45);display:grid;gap:14px}
.sheet p{margin:0;color:var(--muted);font-size:13.5px}
.sheet .btn{width:100%;padding:12px;font-size:14px}
.sheet .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sheet .info{background:var(--panel);border-radius:14px;padding:12px 14px;font-size:13px;display:grid;gap:4px}
.sheet .msg{border-radius:12px;padding:10px 12px;font-size:13px}
.sheet .msg.ok{background:var(--ok-soft);color:var(--ok)} .sheet .msg.bad{background:var(--warn-soft);color:var(--warn)}
@media (max-width:820px){
  .outer{padding-top:max(14px,env(safe-area-inset-top,0px));padding-bottom:calc(86px + env(safe-area-inset-bottom,0px))}
  .shell{background:none;padding:0;border-radius:0;grid-template-columns:minmax(0,1fr)}
  aside{position:fixed;left:0;right:0;bottom:0;top:auto;height:auto;z-index:20;border-radius:20px 20px 0 0;overflow:visible;
    padding:6px max(8px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-right,0px));
    flex-direction:row;box-shadow:0 -8px 30px -18px rgba(20,24,60,.45);border-top:1px solid var(--line)}
  .brand,.promo,.menu .cap,.deskonly{display:none!important}
  .menu{grid-auto-flow:column;grid-auto-columns:1fr;width:100%;gap:2px;overflow:visible}
  .menu a,.menu button{flex-direction:column;justify-content:center;gap:3px;font-size:10.5px;font-weight:600;padding:7px 2px;width:auto;text-align:center;color:var(--muted);border-radius:12px}
  .menu a.on{background:var(--accent-soft);color:var(--accent);box-shadow:none}
  .menu svg{width:21px;height:21px}
  .lg{display:none}.sm{display:inline}
  .mbrand{display:block;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
  h1{font-size:21px}.date{display:none}
  .top{flex-wrap:nowrap}.tools{gap:8px}.save{display:none}.who{display:none}
  main{padding:0;gap:12px}
  .card{border-radius:20px;padding:16px}
  input,.pin,.buyform input{font-size:16px!important}
  .alert .btn{width:100%}
  .chart svg{max-height:200px}
}
@media (max-width:640px){
  .sched tr{grid-template-columns:auto minmax(0,1fr) auto;gap:10px 10px}
  .sched td:nth-child(1){grid-column:1/3}
  .sched td:nth-child(2){grid-column:3;text-align:right}
  .sched td:nth-child(3){grid-column:1;text-align:left}
  .sched td:nth-child(4){grid-column:2;justify-self:start}
  .sched td:nth-child(5){grid-column:3;text-align:right}
  .sched .pill{white-space:normal;line-height:1.3}
  .sched .pin{width:104px;text-align:left}
}
@media (max-width:400px){.big{font-size:23px}.ringwrap svg{width:150px;height:150px}}
/* acesso */
body.locked .outer{display:none}
body:not(.locked) .auth{display:none}
.auth{min-height:100vh;display:grid;place-items:center;padding-top:max(24px,env(safe-area-inset-top,0px));padding-bottom:max(24px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.authcard{width:min(380px,100%);background:var(--card);border-radius:26px;padding:26px 22px;display:grid;gap:14px;box-shadow:0 30px 60px -30px rgba(20,24,60,.35)}
.authcard .logo{width:46px;height:46px;border-radius:14px}
.authcard h2{font-size:22px}
.authcard p{margin:0;color:var(--muted);font-size:13.5px}
.authcard label{display:grid;gap:6px;font-weight:600;font-size:13px}
.authcard input{border:1.5px solid var(--line);border-radius:12px;padding:12px 13px;font:500 16px var(--font);background:var(--panel);color:var(--fg);width:100%}
.authcard input:focus{border-color:var(--accent);outline:none}
.authcard .btn{padding:13px;font-size:15px;width:100%}
.authcard .err{color:var(--warn);font-size:13px;min-height:18px}
.linkish{background:none;border:0;color:var(--muted);font:600 13px var(--font);cursor:pointer;text-decoration:underline;justify-self:center;padding:4px}
.sheet .old{border:1.5px dashed var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:8px;font-size:13px}
.sheet input[type=password]{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px;font:500 16px var(--font);background:var(--card);color:var(--fg)}
@media (max-width:820px){.save.busy,.save.err{display:flex}.save{padding:7px 10px}}
/* empréstimos */
.stats.emp4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:1180px){.stats.emp4{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.stats.emp4{grid-template-columns:1fr}}
.people{display:grid;gap:14px}
.person{display:grid;gap:6px}
.person .row{display:flex;justify-content:space-between;gap:10px;align-items:baseline;font-size:14px;flex-wrap:wrap}
.person .buybar{margin:0;height:8px}
.person .okc{color:var(--ok);font-weight:700}
.small{font-size:12px}
.fchips{display:flex;gap:6px;flex-wrap:wrap}
.fchips button{border:1px solid var(--line);background:var(--panel);color:var(--muted);font:600 12.5px var(--font);border-radius:999px;padding:6px 12px;cursor:pointer}
.fchips button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.sched.emp .rmini{margin-left:auto}
.sched tr.more td{background:var(--panel);border-radius:14px;padding:12px 14px}
.morebox{display:grid;gap:10px}
.empty{color:var(--muted);padding:18px 0;text-align:center;font-size:13.5px}
#lnErr{color:var(--warn);min-height:16px;margin-top:6px}
@media (max-width:640px){
  .sched.emp td:nth-child(2)::before{content:"emprestado "}
  .sched.emp td:nth-child(3){text-align:left}
  .sched.emp .rmini{margin-left:0}
  .sched tr.more{display:block;padding:0 0 12px;border-top:0}
  .sched tr.more td{display:block}
  .sched.emp .btn{padding:8px 12px}
}
/* visão geral */
.tag{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;border-radius:6px;padding:2px 6px;margin-right:8px;vertical-align:2px;white-space:nowrap}
.tag.a{background:var(--accent-soft);color:var(--accent)} .tag.g{background:var(--ok-soft);color:var(--ok)}
.dep.nx{grid-template-columns:1fr auto auto;line-height:1.35}
.dep.nx .tag{margin:0}
@media (max-width:640px){.sched.geral td:nth-child(2)::before{content:"total "}}
/* controle financeiro */
.backl{display:inline-block;color:var(--muted);text-decoration:none;font-weight:600;font-size:13px;margin-bottom:6px}
.backl:hover{color:var(--accent)}
.xbtn{border:0;background:none;color:var(--muted);font-size:20px;line-height:1;cursor:pointer;padding:4px 8px;vertical-align:middle}
.xbtn:hover{color:var(--warn)}
.nowrap{white-space:nowrap}
.hello{display:grid;gap:10px;justify-items:start}
.hello p{margin:0}
.pcard .chead{flex-wrap:wrap}
.pright{display:flex;gap:6px;flex-wrap:wrap}
.pactions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.newitem,.editp{background:var(--panel);border-radius:16px;padding:14px;margin-top:12px}
.newitem input,.editp input{background:var(--card)}
.ftitle{width:100%;font-size:14px}
a.dep{color:inherit;text-decoration:none;border-radius:10px}
a.dep:hover b{color:var(--accent)}
.buyform select{border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--panel);color:var(--fg);font:600 14px var(--font)}
.sched .pprev{width:96px}
/* calculadora */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(10,12,24,.45);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:grid;place-items:center;padding:16px}
.calc{width:min(320px,100%);background:var(--card);color:var(--fg);border-radius:24px;padding:18px;box-shadow:0 30px 60px -20px rgba(0,0,0,.45);display:grid;gap:12px}
.calc .ch{display:flex;justify-content:space-between;align-items:center}
.calc .x{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer;font-size:18px;line-height:1}
.screen{background:var(--panel);border-radius:16px;padding:12px 14px;text-align:right;min-height:78px;display:grid;align-content:end;overflow:hidden}
.screen .ex{font-size:13px;color:var(--muted);min-height:18px;word-break:break-all}
.screen .res{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;word-break:break-all;line-height:1.15}
.keys4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}

  table{min-width:0} thead{display:none}

<script src="config.js"></script>
<script id="main">
(function(){
  var MN = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
  var LT = "lente-theme", mode = "ok";
  var state = {people:[], items:[], parc:[], res:[]};

  /* ---------- utilidades ---------- */
  function brl(n){ return "R$ " + Math.round(n).toLocaleString("pt-BR"); }
  function short(k){ var m = MN[+k.split("-")[1]-1]; return m.charAt(0).toUpperCase()+m.slice(1); }
  function label(k){ return short(k)+"/"+k.slice(0,4); }
  function lab(k){ return MN[+k.split("-")[1]-1]+"/"+k.slice(0,4); }
  function keyOf(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); }
  function nowKey(){ return keyOf(new Date()); }
  function addMonths(k, n){ var p = k.split("-"); return keyOf(new Date(+p[0], +p[1]-1+n, 1)); }
  function mdate(k){ var p = k.split("-"); return new Date(+p[0], +p[1]-1, 1); }
  function isoToday(){ var d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
  function fmtDate(s){ var p=String(s).split("-"); return p.length===3 ? p[2]+"/"+p[1]+"/"+p[0] : s; }
  function esc(t){ return String(t==null?"":t).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function num(v){ var n = parseInt(String(v).replace(/\D/g,""),10); return isNaN(n) ? 0 : n; }
  function sum(a, f){ return a.reduce(function(s,x){ return s + f(x); }, 0); }
  function uuid(){
    if (crypto.randomUUID) return crypto.randomUUID();
    var b = crypto.getRandomValues(new Uint8Array(16)); b[6] = b[6]&15|64; b[8] = b[8]&63|128;
    var h = Array.prototype.map.call(b, function(x){ return ("0"+x.toString(16)).slice(-2); }).join("");
    return h.slice(0,8)+"-"+h.slice(8,12)+"-"+h.slice(12,16)+"-"+h.slice(16,20)+"-"+h.slice(20);
  }
  function todayStr(){ var t = new Date().toLocaleDateString("pt-BR",{weekday:"long", day:"numeric", month:"long", year:"numeric"}); return t.charAt(0).toUpperCase()+t.slice(1); }
  var TIPO = {emprestimo:"Empréstimo", aluguel:"Aluguel"};

  /* ---------- tema ---------- */
  function currentTheme(){
    var t = document.documentElement.getAttribute("data-theme");
    if (t) return t;
    return window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  }
  try { var st0 = localStorage.getItem(LT); if (st0) document.documentElement.setAttribute("data-theme", st0); } catch(e){}
  function toggleTheme(){
    var t = currentTheme()==="dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", t);
    try { localStorage.setItem(LT, t); } catch(e){}
    render();
  }

  var IC = {
    wallet:'<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="18" height="13" rx="3"></rect><path d="M16 12.5h2"></path><path d="M3 9h14a2 2 0 0 0 0-4H6"></path></svg>',
    check:'<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"></circle><path d="m8 12 3 3 5-6"></path></svg>',
    cal:'<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>',
    clock:'<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>',
    users:'<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.5"></circle><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"></path><path d="M16 4.5a3.5 3.5 0 0 1 0 7M21 20c0-2.6-1.6-4.8-4-5.6"></path></svg>',
    sun:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>',
    data:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 4v13M3.5 13.5 7 17l3.5-3.5M17 20V7M13.5 10.5 17 7l3.5 3.5"></path></svg>',
    lock:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>',
    moon:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"></path></svg>'
  };

  /* ---------- dados: consultas ---------- */
  function byId(list, id){ for (var i=0;i<list.length;i++) if (list[i].id === id) return list[i]; return null; }
  function itemsOf(pid){ return state.items.filter(function(i){ return i.pessoa === pid; }); }
  function parcOf(iid){ return state.parc.filter(function(r){ return r.item === iid; }).sort(function(a,b){ return a.mes < b.mes ? -1 : 1; }); }
  function resOf(iid){ return state.res.filter(function(r){ return r.item === iid; }); }
  function itemCalc(it){
    var rows = parcOf(it.id), cur = nowKey(), total = 0, paid = 0, dueBefore = 0, next = null, open = 0;
    rows.forEach(function(r){
      total += r.prev; paid += r.pago;
      if (r.mes < cur) dueBefore += r.prev;
      if (r.pago < r.prev) { open++; if (!next && r.mes >= cur) next = r; }
    });
    var rest = Math.max(0, total - paid), late = rest > 0 ? Math.max(0, dueBefore - paid) : 0;
    var first = rows.length ? rows[0].mes : null, last = rows.length ? rows[rows.length-1].mes : null, tp = 0, end = null;
    if (first) {
      end = mdate(addMonths(last,1));
      tp = Math.min(1, Math.max(0, (Date.now() - mdate(first)) / (end - mdate(first))));
    }
    var st = rest <= 0 && total > 0 ? "quitado" : late > 0 ? "atrasado" : next && next.mes === cur ? "mes" : "emdia";
    return {rows:rows, total:total, paid:paid, rest:rest, late:late, next:next, open:open, first:first, last:last, tp:tp, end:end, st:st,
      vp: total ? Math.min(1, paid/total) : 0, res: sum(resOf(it.id), function(r){ return r.v; })};
  }
  function personCalc(pid){
    var c = {total:0, paid:0, rest:0, late:0, n:0, open:0};
    itemsOf(pid).forEach(function(it){ var k = itemCalc(it); c.total += k.total; c.paid += k.paid; c.rest += k.rest; c.late += k.late; c.n++; if (k.rest > 0) c.open++; });
    return c;
  }
  function statusPill(k){
    if (k.st === "quitado") return '<span class="pill paid">Quitado</span>';
    if (k.st === "atrasado") return '<span class="pill late">Atrasado · '+brl(k.late)+'</span>';
    if (k.st === "mes") return '<span class="pill now">Vence este mês</span>';
    return k.total ? '<span class="pill paid">Em dia</span>' : '<span class="pill todo">Sem parcelas</span>';
  }
  function rowPill(r){
    var cur = nowKey(), rest = Math.max(0, r.prev - r.pago);
    if (r.pago >= r.prev) return '<span class="pill paid">Pago</span>';
    if (r.pago > 0) return '<span class="pill part">Parcial · falta '+brl(rest)+'</span>';
    if (r.mes < cur) return '<span class="pill late">Atrasado</span>';
    if (r.mes === cur) return '<span class="pill now">Vence este mês</span>';
    return '<span class="pill todo">Em aberto</span>';
  }

  /* ---------- peças visuais ---------- */
  function rings(tp, vp, fp){
    function arc(r, p, color, w){
      var len = 75 * p;
      return '<circle cx="90" cy="90" r="'+r+'" fill="none" stroke="var(--track)" stroke-width="'+w+'" stroke-linecap="round" pathLength="100" stroke-dasharray="75 100" transform="rotate(135 90 90)"></circle>'+
        (p>0 ? '<circle cx="90" cy="90" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="'+w+'" stroke-linecap="round" pathLength="100" stroke-dasharray="'+len.toFixed(2)+' 100" transform="rotate(135 90 90)"></circle>' : '');
    }
    return '<svg viewBox="0 0 180 180" role="img" aria-label="Progresso">'+arc(78, tp, "var(--accent)", 12) + arc(58, vp, "var(--ok)", 12) + arc(38, fp, "var(--warn)", 12)+'</svg>';
  }
  // barras: series = [{k, a, b}] com rótulos e cores de a e b; stack empilha as duas
  function bars(series, ca, cb, na, nb, stack){
    if (!series.length) return '<div class="empty">Os valores aparecem aqui mês a mês.</div>';
    var W=560, H=230, L=44, R=10, T=14, B=30, cw=W-L-R, ch=H-T-B;
    var max = Math.max(1000, Math.max.apply(null, series.map(function(m){ return stack ? m.a + m.b : Math.max(m.a, m.b); })));
    var step = max > 40000 ? 10000 : max > 20000 ? 5000 : max > 6000 ? 2000 : 1000;
    max = Math.ceil(max/step)*step;
    var s = '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Valores por mês">';
    for (var g=0; g<=max; g+=step){
      var y = T + ch - ch*g/max;
      s += '<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'" stroke="var(--line)" stroke-dasharray="3 4"></line>';
      s += '<text x="'+(L-8)+'" y="'+(y+4)+'" text-anchor="end" font-size="11" fill="var(--muted)">'+(g? (g/1000)+'K' : '0')+'</text>';
    }
    var slot = cw/series.length;
    series.forEach(function(m,i){
      var cx = L + slot*i + slot/2, ha = ch*m.a/max, hb = ch*m.b/max, base = T+ch;
      if (stack) {
        var bw = Math.min(26, slot/2.2);
        if (ha > 0) s += '<rect x="'+(cx-bw/2)+'" y="'+(base-ha)+'" width="'+bw+'" height="'+ha+'" rx="'+Math.min(6,ha/2)+'" fill="'+ca+'"><title>'+na+' em '+label(m.k)+': '+brl(m.a)+'</title></rect>';
        if (hb > 0) s += '<rect x="'+(cx-bw/2)+'" y="'+(base-ha-hb-(ha>0?2:0))+'" width="'+bw+'" height="'+hb+'" rx="'+Math.min(6,hb/2)+'" fill="'+cb+'"><title>'+nb+' em '+label(m.k)+': '+brl(m.b)+'</title></rect>';
      } else {
        var w = Math.min(22, slot/3.2);
        s += '<rect x="'+(cx-w-3)+'" y="'+(base-ha)+'" width="'+w+'" height="'+ha+'" rx="'+Math.min(w/2,Math.max(ha,0.1)/2)+'" fill="'+ca+'"><title>'+na+' em '+label(m.k)+': '+brl(m.a)+'</title></rect>';
        if (hb > 0) s += '<rect x="'+(cx+3)+'" y="'+(base-hb)+'" width="'+w+'" height="'+hb+'" rx="'+Math.min(w/2,hb/2)+'" fill="'+cb+'"><title>'+nb+' em '+label(m.k)+': '+brl(m.b)+'</title></rect>';
      }
      s += '<text x="'+cx+'" y="'+(H-8)+'" text-anchor="middle" font-size="11.5" fill="var(--muted)">'+short(m.k)+'</text>';
    });
    return s + '</svg>';
  }
  function tools(){
    var dark = currentTheme()==="dark";
    var saveTxt = mode==="error" ? "Sem conexão, tentando de novo" : mode==="busy" ? "Salvando…" : "Salvo no banco";
    var saveCls = mode==="error" ? "err" : mode==="busy" ? "busy" : "ok";
    return '<div class="tools"><div class="save '+saveCls+'"><span class="dot"></span>'+saveTxt+'</div>'+
      '<button class="iconbtn" id="theme" title="'+(dark?"Mudar para tela clara":"Mudar para tela escura")+'" aria-label="'+(dark?"Mudar para tela clara":"Mudar para tela escura")+'">'+(dark?IC.sun:IC.moon)+'</button>'+
      '<button class="iconbtn" id="logout" title="Sair" aria-label="Sair">'+IC.lock+'</button>'+
      '<button class="iconbtn" id="openData" title="Backup dos dados" aria-label="Backup dos dados">'+IC.data+'</button></div>';
  }
  function top(brand, title, back){
    return '<div class="top" id="topo"><div>'+(back ? '<a class="backl" href="'+back.href+'">← '+esc(back.t)+'</a>' : '')+
      '<div class="mbrand">'+brand+'</div><h1>'+title+'</h1><div class="date">'+todayStr()+'</div></div>'+tools()+'</div>';
  }
  function bindTools(){
    document.getElementById("theme").onclick = toggleTheme;
    document.getElementById("openData").onclick = openData;
    document.getElementById("logout").onclick = function(){ lock(true); };
  }
  function itemRow(it, k, showPerson){
    var p = byId(state.people, it.pessoa), pc = k.total ? Math.min(100, k.paid/k.total*100) : 0;
    var sub = (showPerson && p ? esc(p.nome)+' · ' : '') + (k.first ? (k.rows.length > 1 ? k.rows.length+' parcelas · '+lab(k.first)+' a '+lab(k.last) : 'vence '+lab(k.first)) : 'sem parcelas') + (k.rest > 0 ? ' · falta '+brl(k.rest) : '');
    return '<tr><td><div class="m"><span class="tag '+(it.tipo==="aluguel"?"a":"g")+'">'+TIPO[it.tipo]+'</span>'+esc(it.desc)+'</div><div class="muted">'+sub+'</div></td>'+
      '<td class="r">'+brl(k.total)+'</td><td class="r"><span class="rv">'+brl(k.paid)+'</span><div class="mini rmini"><i style="width:'+pc.toFixed(0)+'%"></i></div></td>'+
      '<td>'+statusPill(k)+'</td><td class="r"><a class="btn soft" href="#item/'+it.id+'" style="text-decoration:none">Abrir</a></td></tr>';
  }
  function itemTable(rows, first){
    return '<div class="sched emp geral"><table><thead><tr><th>'+(first||'Item')+'</th><th class="r">Total</th><th class="r">Recebido</th><th>Situação</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>';
  }

  /* ---------- rotas: #geral, #pessoas, #item/<id> ---------- */
  var route = {v:"geral", id:null};
  function readRoute(){
    var h = location.hash.replace(/^#/,""), m = h.match(/^item\/([0-9a-f-]{36})$/);
    if (m) route = {v:"item", id:m[1]};
    else if (h === "pessoas" || h.indexOf("pessoa/") === 0) route = {v:"pessoas", id:h.split("/")[1]||null};
    else route = {v:"geral", id:null};
  }
  window.addEventListener("hashchange", function(){
    var prev = route.v+route.id; readRoute(); if (prev === route.v+route.id) return;
    render(); window.scrollTo(0,0);
    var el = route.v === "pessoas" && route.id && document.getElementById("p-"+route.id); if (el) el.scrollIntoView({block:"start"});
  });
  function spy(){
    var on = route.v === "item" ? "pessoas" : route.v;
    document.querySelectorAll("[data-spy]").forEach(function(a){ a.classList.toggle("on", a.dataset.spy === on); });
  }
  function render(){
    if (!S || !server) return;
    if (route.v === "item" && !byId(state.items, route.id)) route = {v:"pessoas", id:null};
    if (route.v === "item") renderItem(byId(state.items, route.id));
    else if (route.v === "pessoas") renderPessoas();
    else renderGeral();
    bindTools(); spy();
  }

  /* ---------- visão geral ---------- */
  function renderGeral(){
    var cur = nowKey(), all = state.items.map(function(it){ return {it:it, k:itemCalc(it)}; });
    var toGet = sum(all, function(x){ return x.k.rest; }), got = sum(all, function(x){ return x.k.paid; }), whole = sum(all, function(x){ return x.k.total; });
    var late = sum(all, function(x){ return x.k.late; }), lateN = all.filter(function(x){ return x.k.late > 0; }).length;
    var open = all.filter(function(x){ return x.k.rest > 0; });
    var monthRows = state.parc.filter(function(r){ return r.mes === cur; });
    var monthIn = sum(monthRows, function(r){ return r.pago; }), monthDue = Math.max(monthIn, sum(monthRows, function(r){ return r.prev; }));
    // recebido por mês: aluguel x empréstimo (últimos 8 meses com movimento)
    var tipoOf = {}; state.items.forEach(function(i){ tipoOf[i.id] = i.tipo; });
    var paidRows = state.parc.filter(function(r){ return r.pago > 0; }), months = [];
    if (paidRows.length) {
      var last = cur, first = paidRows.reduce(function(a,r){ return r.mes < a ? r.mes : a; }, cur);
      paidRows.forEach(function(r){ if (r.mes > last) last = r.mes; });
      if (addMonths(last,-7) > first) first = addMonths(last,-7);
      var at = {};
      for (var k = first; k <= last; k = addMonths(k,1)) { at[k] = {k:k, a:0, b:0}; months.push(at[k]); }
      paidRows.forEach(function(r){ var m = at[r.mes]; if (m) { if (tipoOf[r.item] === "aluguel") m.a += r.pago; else m.b += r.pago; } });
    }
    // próximos recebimentos: a próxima parcela de cada item
    var next = all.filter(function(x){ return x.k.next; }).map(function(x){ return {x:x, r:x.k.next}; })
      .sort(function(a,b){ return a.r.mes < b.r.mes ? -1 : a.r.mes > b.r.mes ? 1 : 0; }).slice(0,6);
    var rows = open.slice().sort(function(a,b){
      if ((b.k.late>0) !== (a.k.late>0)) return b.k.late > 0 ? 1 : -1;
      var na = a.k.next ? a.k.next.mes : "9999", nb = b.k.next ? b.k.next.mes : "9999"; return na < nb ? -1 : na > nb ? 1 : 0;
    }).map(function(x){ return itemRow(x.it, x.k, true); }).join("");
    var done = all.length - open.length;

    document.getElementById("app").innerHTML =
      top("Controle financeiro", "Visão geral")+
      (state.people.length ? '' : '<div class="card hello"><h2>Comece cadastrando uma pessoa</h2><p class="muted">Depois adicione os empréstimos e aluguéis dela e vá marcando o que recebe.</p><a class="btn" href="#pessoas" style="text-decoration:none">Cadastrar pessoa</a></div>')+
      '<div class="stats emp4">'+

      var edit = ui.editPerson === p.id ?

          '<label>Contato<input name="contato" value="'+esc(p.contato||"")+'" maxlength="120" style="width:160px"></label>'+

      return '<div class="card pcard" id="p-'+p.id+'"><div class="chead"><div><h2>'+esc(p.nome)+'</h2><div class="muted">'+

    }).join("");
    var tot = sum(state.people, function(p){ return personCalc(p.id).rest; });

  function createItem(f){
    var tipo = f.dataset.t, valor = num(f.valor.value), n = Math.max(1, Math.min(120, num(f.n.value) || 1)), mes = f.mes.value || nowKey();
    if (!(valor > 0)) { f.valor.focus(); return null; }
    var desc = f.desc.value.trim() || (tipo === "aluguel" ? "Aluguel" : "Empréstimo");
    var it = {id:uuid(), pessoa:f.dataset.p, tipo:tipo, desc:desc, inicio: tipo === "aluguel" ? mes+"-01" : (f.data.value || isoToday()),
      mensal: tipo === "aluguel" ? valor : null, compra: tipo === "aluguel" ? (num(f.compra.value) || null) : null,
      renov: tipo === "aluguel" ? (num(f.renov.value) || null) : null, escolha:null, obs:f.obs.value.trim() || null};
    state.items.push(it);
    // cronograma: empréstimo divide o valor nas parcelas; aluguel repete a mensalidade
    var base = tipo === "aluguel" ? valor : Math.floor(valor / n);
    for (var i = 0; i < n; i++) {
      var prev = tipo === "aluguel" ? valor : (i === n-1 ? valor - base*(n-1) : base);
      state.parc.push({id:uuid(), item:it.id, mes:addMonths(mes, i), prev:prev, pago:0, rot: n > 1 ? (tipo === "aluguel" ? "Mês " : "Parcela ")+(i+1)+"/"+n : null});
    }
    return it;
  }
  function removeItem(id){
    state.items = state.items.filter(function(i){ return i.id !== id; });

    state.res = state.res.filter(function(r){ return r.item !== id; });
  }
  function removePerson(pid){
    itemsOf(pid).forEach(function(it){ removeItem(it.id); });
    state.people = state.people.filter(function(p){ return p.id !== pid; });
  }

  /* ---------- painel de um item ---------- */

    // gráfico: até 12 meses em volta do mês atual

    var from = Math.max(0, Math.min(idx - 5, k.rows.length - 12));
    var series = k.rows.slice(from, from + 12).map(function(r){ return {k:r.mes, a:r.prev, b:r.pago}; });

      var act = r.pago >= r.prev ? '<button class="btn soft" data-undo="'+r.id+'">Desfazer</button>' : '<button class="btn" data-full="'+r.id+'">Recebi</button>';
      if (!r.pago) act += '<button class="xbtn" data-rm="'+r.id+'" title="Remover este mês" aria-label="Remover '+label(r.mes)+'">×</button>';

        (aluguel ? '<label>Mensalidade<input name="mensal" inputmode="numeric" value="'+(it.mensal||"")+'" style="width:110px"></label>'+

    document.getElementById("app").innerHTML =
      top(TIPO[it.tipo]+(p ? ' · '+esc(p.nome) : ''), esc(it.desc), {href:"#pessoa/"+it.pessoa, t: p ? p.nome : "Pessoas"})+
      '<div class="grid">'+
        '<div class="stats">'+
          '<div class="card stat hero"><div class="row1"><div class="ico">'+IC.wallet+'</div><span class="badge w">'+k.open+(k.open===1?' parcela':' parcelas')+'</span></div><div class="lbl">Falta receber</div><div class="num"><span class="big">'+brl(k.rest)+'</span><span class="muted">de '+brl(k.total)+'</span></div></div>'+

      '<div class="row2"><button class="btn" id="dExport">Baixar cópia</button><button class="btn soft" id="dImport">Restaurar cópia</button></div>'+
      '<input type="file" id="dFile" accept=".json,application/json" hidden><div id="dMsg"></div></div>';
    document.body.appendChild(ov);
    function note(kind, html){ document.getElementById("dMsg").innerHTML = '<div class="msg '+kind+'">'+html+'</div>'; }
    ov.addEventListener("click", function(e){ if (e.target===ov) closeData(); });
    document.getElementById("dClose").onclick = closeData;
    document.getElementById("dExport").onclick = function(){ doExport(note); };
    document.getElementById("dImport").onclick = function(){ document.getElementById("dFile").click(); };
    document.getElementById("dFile").onchange = function(){
      var f = this.files && this.files[0]; this.value = "";
      if (!f) return;
      var r = new FileReader();
      r.onload = function(){
        var o;
        try { o = parseBackup(String(r.result)); } catch(e){ return note("bad","Esse arquivo não é uma cópia do controle financeiro."); }
        note("bad", 'Cópia de <b>'+when(o.gerado)+'</b> com '+o.people.length+' pessoas e '+o.items.length+' itens. Restaurar troca <b>tudo</b> o que está no banco por ela.'+
          '<div class="row2" style="margin-top:10px"><button class="btn" id="dApply">Restaurar</button><button class="btn ghost" id="dCancel">Cancelar</button></div>');
        document.getElementById("dApply").onclick = function(){ state = {people:o.people, items:o.items, parc:o.parc, res:o.res}; closeData(); changed(); };
        document.getElementById("dCancel").onclick = function(){ document.getElementById("dMsg").innerHTML = ""; };
      };
      r.readAsText(f);
    };
    document.addEventListener("keydown", dataKeys);
  }
  function dataKeys(e){ if (e.key==="Escape") closeData(); }
  function closeData(){ var ov=document.getElementById("dataOv"); if (ov) ov.remove(); document.removeEventListener("keydown", dataKeys); }
  document.getElementById("openData2").onclick = openData;

  /* ---------- calculadora ---------- */
  var cx = {expr:"", last:""};
  function evalExpr(str){
    var t = str.replace(/,/g,".").match(/\d*\.?\d+|[-+*\/]/g) || [], i = 0;
    function numx(){ var tk=t[i++]; if (tk==="-") return -numx(); if (tk==="+") return numx(); var v=parseFloat(tk); if (isNaN(v)) throw 0; return v; }
    function term(){ var v=numx(); while(t[i]==="*"||t[i]==="/"){ var o=t[i++], r=numx(); v = o==="*" ? v*r : v/r; } return v; }
    function expr(){ var v=term(); while(t[i]==="+"||t[i]==="-"){ var o=t[i++], r=term(); v = o==="+" ? v+r : v-r; } return v; }
    var v = expr(); if (i < t.length || !isFinite(v)) throw 0; return v;
  }
  function show(){ var sym = cx.expr.replace(/\*/g,"×").replace(/\//g,"÷").replace(/-/g,"−").replace(/\./g,",");
    document.getElementById("cEx").textContent = cx.last; document.getElementById("cRes").textContent = sym || "0"; }
  function press(k){
    var ops = "+-*/";
    if (k==="C") { cx.expr=""; cx.last=""; }
    else if (k==="back") cx.expr = cx.expr.slice(0,-1);
    else if (k==="=") { if (!cx.expr) return; try { var v = evalExpr(cx.expr); cx.last = cx.expr.replace(/\*/g,"×").replace(/\//g,"÷").replace(/-/g,"−").replace(/\./g,",")+" ="; cx.expr = String(Math.round(v*1e8)/1e8); } catch(e){ cx.last="Conta incompleta"; } }
    else if (k==="%") { var m = cx.expr.match(/(\d*\.?\d+)$/); if (m) cx.expr = cx.expr.slice(0,-m[1].length) + String(parseFloat(m[1])/100); }
    else if (ops.indexOf(k)>=0) { if (!cx.expr && k!=="-") return; if (ops.indexOf(cx.expr.slice(-1))>=0) cx.expr = cx.expr.slice(0,-1); cx.expr += k; }
    else if (k===".") { var seg = cx.expr.split(/[-+*\/]/).pop(); if (seg.indexOf(".")<0) cx.expr += seg ? "." : "0."; }
    else cx.expr += k;
    show();
  }
  function openCalc(){
    if (document.getElementById("calcOv")) return;
    var ov = document.createElement("div"); ov.className="overlay"; ov.id="calcOv";
    var K = [["C","C","fn"],["back","⌫","fn"],["%","%","fn"],["/","÷","op"],["7","7"],["8","8"],["9","9"],["*","×","op"],["4","4"],["5","5"],["6","6"],["-","−","op"],["1","1"],["2","2"],["3","3"],["+","+","op"],["0","0","zero"],[".",","],["=","=","eq"]];
    ov.innerHTML = '<div class="calc" role="dialog" aria-modal="true" aria-label="Calculadora"><div class="ch"><h2>Calculadora</h2><button class="x" id="cClose" aria-label="Fechar">×</button></div>'+
      '<div class="screen"><div class="ex" id="cEx"></div><div class="res" id="cRes">0</div></div><div class="keys4">'+
      K.map(function(k){ return '<button type="button" data-key="'+k[0]+'" class="'+(k[2]||"")+'">'+k[1]+'</button>'; }).join("")+'</div></div>';
    document.body.appendChild(ov);
    ov.addEventListener("click", function(e){ if (e.target===ov) closeCalc(); var b=e.target.closest("[data-key]"); if (b) press(b.dataset.key); });
    document.getElementById("cClose").onclick = closeCalc;
    document.addEventListener("keydown", calcKeys);
    show(); document.getElementById("cClose").focus();
  }
  function closeCalc(){ var ov=document.getElementById("calcOv"); if (ov) ov.remove(); document.removeEventListener("keydown", calcKeys); }
  function calcKeys(e){
    var k = e.key;
    if (k==="Escape") return closeCalc();
    if (/^[0-9]$/.test(k) || "+-*/%".indexOf(k)>=0) press(k);
    else if (k==="," || k===".") press(".");
    else if (k==="Enter" || k==="=") { e.preventDefault(); press("="); }
    else if (k==="Backspace") press("back");
    else if (k==="Delete" || k==="c" || k==="C") press("C");
    else return;
    e.preventDefault();
  }
  document.getElementById("openCalc").onclick = openCalc;

  /* ---------- início ---------- */
  ["lente-vault-v1","lente-vault-v1-antigo","lente-state-v1","lente-gh-v1","lente-view"].forEach(function(k){ try { localStorage.removeItem(k); } catch(e){} });
  readRoute();
  (function start(){
    if (!window.fetch || !window.crypto) {
      authEl().innerHTML = '<div class="authcard"><h2>Navegador sem suporte</h2><p>Abra no Safari, Chrome ou Edge atualizados.</p></div>'; return;
    }
    if (!CFG.url || !CFG.key) return showSetup();
    var saved = null;
    try { saved = JSON.parse(localStorage.getItem(LSS) || "null"); } catch(e){}
    if (!saved || !saved.s || Date.now() - (saved.seen||0) > 5*60*1000) { dropSession(); return showLogin(); }
    S = saved.s;
    authEl().innerHTML = '<div class="authcard">'+AUTHBRAND+'<p>Carregando…</p></div>';
    refresh().then(load).then(unlock).catch(function(){ dropSession(); showLogin(); });
  })();

  if ("serviceWorker" in navigator && location.protocol === "https:") {
    navigator.serviceWorker.register("sw.js").catch(function(){});
  }
})();
</script>
